<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    
    <!-- DNS-Prefetch & Preconnect for Above-the-Fold Images, Flight Widget & Analytics -->
    <link rel="preconnect" href="https://tpwgts.com" crossorigin />
    <link rel="dns-prefetch" href="https://tpwgts.com" />
    
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    
    <link rel="preconnect" href="https://images.pexels.com" crossorigin />
    <link rel="dns-prefetch" href="https://images.pexels.com" />

    <link rel="preconnect" href="https://www.googletagmanager.com" crossorigin />
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />

    <!-- Core Googlebot Requirement (Multiple of 48px) -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <!-- Standard PNG Fallbacks -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <!-- Apple Mobile Requirement -->
    <link rel="apple-touch-icon" href="/icon-192.png" />
    
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#071226" />
    
    <title>Compare Cheap Flights Worldwide | FlySava</title>
    <meta name="description" content="Search, compare, and book the cheapest flights from hundreds of airlines and travel agencies worldwide with FlySava." />

    <!-- SEO Protection: Canonical Tag -->
    <link rel="canonical" href="https://flysava.com" />

    <!-- Google Analytics (Non-blocking) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-FX092L0H7V"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-FX092L0H7V', { send_page_view: false });
    </script>
  </head>
  <body class="bg-[#F8FAFC] text-slate-900 antialiased selection:bg-blue-100 selection:text-blue-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
